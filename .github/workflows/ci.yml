name: CI

on:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is native. Prebuilds cover common runners; this toolchain
      # is what `npm ci` needs when it has to compile the module instead.
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Mock-mode smoke
        env:
          MOCK_LLM: "1"
          # The sample path is off unless this is exactly 1 or true.
          # A sample does not start without a keyed IP hash.
          DEMO_ENABLED: "1"
          DEMO_IP_SALT: "abababababababababababababababababababababababababababababababab"
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/next-dev.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/keys >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "next dev exited before it was ready"
              cat /tmp/next-dev.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "timed out waiting for next dev"
            cat /tmp/next-dev.log
            exit 1
          fi
          npm run smoke || {
            echo "smoke failed; next dev log:"
            cat /tmp/next-dev.log
            exit 1
          }

  # Separate from Check so a browser install does not slow typecheck, lint, or unit tests.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        env:
          MOCK_LLM: "1"
        run: npm run e2e

  # SQLite accepts `? IS NULL` without a type. These billing paths failed on
  # Postgres in the sandbox, so they run here against a real server.
  billing-postgres:
    name: Billing Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: defendit
          POSTGRES_PASSWORD: defendit
          POSTGRES_DB: defendit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defendit -d defendit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Postgres billing tests
        env:
          DATABASE_URL: postgres://defendit:defendit@localhost:5432/defendit
        run: npm run test:postgres
